<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>XR Master Explorer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
      #menu {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle, #2c3e50, #000);
        z-index: 9999; display: flex; flex-direction: column; 
        justify-content: center; align-items: center; color: white;
      }
      .choice-btn {
        margin: 5px; padding: 15px 25px; font-size: 0.9rem; cursor: pointer;
        border: 2px solid white; background: rgba(255,255,255,0.1);
        color: white; border-radius: 12px; width: 310px; transition: 0.2s;
      }
      .choice-btn:hover { background: white; color: black; }
      #backBtn {
        position: fixed; top: 20px; left: 20px; z-index: 8888;
        padding: 12px 24px; background: rgba(0,0,0,0.8);
        color: white; border: 1px solid white; border-radius: 8px;
        display: none; cursor: pointer;
      }
      #ar-instructions {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.7); color: white; padding: 12px; 
        border-radius: 10px; display: none; z-index: 1000; text-align: center;
      }
    </style>
  </head>
  <body>

    <button id="backBtn" onclick="location.reload()">← Back to Menu</button>
    <div id="ar-instructions">Initializing...</div>

    <div id="menu">
      <h1 style="margin-bottom: 15px;">XR Explorer Hub</h1>
      <button class="choice-btn" onclick="start360('forestTex')">360° NZ Forest</button>
      <button class="choice-btn" onclick="start360('trenchTex')">360° WW1 Trench</button>
      <button class="choice-btn" onclick="startStaticAR()">AR: Simple Projector</button>
      <button class="choice-btn" onclick="startHitTestAR()">AR: Drop & Walk (Chrome)</button>
      <button class="choice-btn" onclick="startImageTracking()">AR: Hiro Marker Tracker</button>
      <button class="choice-btn" style="border-color: #f39c12; font-weight: bold;" onclick="startPersistentCat()">AR: Persistent Cat (Image Tracker)</button>
    </div>

    <a-scene id="mainScene" style="display: none;" webxr="optionalFeatures: hit-test;" renderer="antialias: true; colorManagement: true;">
      
      <a-assets>
        <img id="forestTex" src="Gemini_Generated_Image_ojdhy8ojdhy8ojdhy" crossorigin="anonymous">
        <img id="trenchTex" src="Trench sphere.jpg" crossorigin="anonymous">
        <img id="catFace" src="pattern_Cat.png" crossorigin="anonymous">
      </a-assets>

      <a-sky id="skyDisplay" visible="false" radius="100" rotation="0 -90 0"></a-sky>

      <a-entity id="arStaticGroup" visible="false">
        <a-box position="-1 0.5 -3" rotation="0 45 0" color="#EF2D5E" scale="0.5 0.5 0.5"></a-box>
      </a-entity>

      <a-entity id="hitTestAnchor" ar-hit-test="target: #droppedObjects; type: floor;">
         <a-entity id="droppedObjects" visible="false">
            <a-torus-knot color="#BBAEFB" radius="0.3" position="0 0.5 0" scale="0.5 0.5 0.5"></a-torus-knot>
         </a-entity>
      </a-entity>

      <a-marker id="hiroMarker" preset="hiro" visible="false">
        <a-box position="0 0.5 0" scale="0.3 0.3 0.3" color="yellow"></a-box>
      </a-marker>

      <a-marker id="catMarker" type="pattern" url="pattern-cat.patt" emitevents="true"></a-marker>
      
      <a-entity id="persistentCat" visible="false">
        <a-entity position="0 0.3 0" scale="0.2 0.2 0.2">
            <a-plane position="0 0 0.5" src="#catFace"></a-plane>
            <a-plane position="0 0 -0.5" rotation="0 180 0" color="#f39c12"></a-plane>
            <a-plane position="-0.5 0 0" rotation="0 -90 0" color="#e67e22"></a-plane>
            <a-plane position="0.5 0 0" rotation="0 90 0" color="#d35400"></a-plane>
            <a-plane position="0 0.5 0" rotation="-90 0 0" color="#f1c40f"></a-plane>
        </a-entity>
      </a-entity>

      <a-entity id="cam" camera="fov: 80" look-controls="magicWindowTrackingEnabled: true; touchEnabled: true" position="0 1.6 0"></a-entity>
    </a-scene>

    <script>
      const menu = document.getElementById('menu');
      const scene = document.getElementById('mainScene');
      const backBtn = document.getElementById('backBtn');
      const sky = document.getElementById('skyDisplay');
      const staticGroup = document.getElementById('arStaticGroup');
      const droppedObjects = document.getElementById('droppedObjects');
      const hiroMarker = document.getElementById('hiroMarker');
      const catMarker = document.getElementById('catMarker');
      const persistentCat = document.getElementById('persistentCat');
      const instructions = document.getElementById('ar-instructions');

      let mode = "";

      function setupScene() {
        menu.style.display = 'none';
        backBtn.style.display = 'block';
        scene.style.display = 'block';
        scene.resize();
      }

      function start360(texID) {
        setupScene();
        sky.setAttribute('visible', 'true');
        sky.setAttribute('src', '#' + texID);
      }

      function startStaticAR() {
        setupScene();
        staticGroup.setAttribute('visible', 'true');
        scene.setAttribute('arjs', 'sourceType: webcam; debugUIEnabled: false;');
      }

      function startHitTestAR() {
        setupScene();
        mode = "hit-test";
        instructions.innerText = "Scan floor and tap to drop object";
        instructions.style.display = "block";
      }

      function startImageTracking() {
        setupScene();
        hiroMarker.setAttribute('visible', 'true');
        scene.setAttribute('arjs', 'sourceType: webcam; debugUIEnabled: false;');
        instructions.innerText = "Point at Hiro Marker";
        instructions.style.display = "block";
      }

      function startPersistentCat() {
        setupScene();
        mode = "cat";
        scene.setAttribute('arjs', 'sourceType: webcam; debugUIEnabled: false;');
        instructions.innerText = "Point at Cat Image to Lock Anchor";
        instructions.style.display = "block";
      }

      // World-Handoff Logic for the Cat
      catMarker.addEventListener('markerFound', () => {
        if (mode === "cat") {
          // Capture marker position in world space
          const worldPos = new THREE.Vector3();
          catMarker.object3D.getWorldPosition(worldPos);
          
          persistentCat.setAttribute('position', worldPos);
          persistentCat.setAttribute('rotation', catMarker.getAttribute('rotation'));
          persistentCat.setAttribute('visible', 'true');
          
          instructions.innerText = "Cat Locked! You can now move around it.";
        }
      });

      window.addEventListener('click', function () {
        if (mode === "hit-test" && !droppedObjects.getAttribute('visible')) {
          droppedObjects.setAttribute('visible', 'true');
          instructions.innerText = "Dropped!";
        }
      });
    </script>
  </body>
</html>
