<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>XR Video & Image Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
      #menu {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle, #2c3e50, #000);
        z-index: 9999; display: flex; flex-direction: column; 
        justify-content: center; align-items: center; color: white;
      }
      .choice-btn {
        margin: 8px; padding: 18px 30px; font-size: 1rem; cursor: pointer;
        border: 2px solid white; background: rgba(255,255,255,0.1);
        color: white; border-radius: 12px; width: 300px; transition: 0.3s;
      }
      .choice-btn:hover { background: white; color: black; }
      #backBtn {
        position: fixed; top: 20px; left: 20px; z-index: 8888;
        padding: 12px 24px; background: rgba(0,0,0,0.8);
        color: white; border: 1px solid white; border-radius: 8px;
        display: none; cursor: pointer;
      }
      #ar-instructions {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.7); color: white; padding: 12px; 
        border-radius: 10px; display: none; z-index: 1000; text-align: center;
      }
    </style>
  </head>
  <body>

    <button id="backBtn" onclick="location.reload()">← Back to Menu</button>
    <div id="ar-instructions">Initializing...</div>

    <div id="menu">
      <h1 style="margin-bottom: 20px;">XR Explorer</h1>
      <button class="choice-btn" onclick="start360('forestTex')">360° NZ Forest (Image)</button>
      <button class="choice-btn" onclick="start360('trenchTex')">360° WW1 Trench (Image)</button>
      <button class="choice-btn" style="border-color: #3498db;" onclick="startVideo()">360° VR Experience (Video)</button>
      <button class="choice-btn" onclick="startStaticAR()">AR: Simple Projector</button>
      <button class="choice-btn" style="border-color: #f39c12;" onclick="startPersistentCat()">AR: Holographic Cat Tracker</button>
    </div>

    <a-scene id="mainScene" style="display: none;" renderer="antialias: true; colorManagement: true;">
      
      <a-assets>
        <img id="forestTex" src="Gemini_Generated_Image_ojdhy8ojdhy8ojdh.png" crossorigin="anonymous">
        <img id="trenchTex" src="Trench sphere.jpg" crossorigin="anonymous">
        <img id="catFace" src="pattern_Cat.png" crossorigin="anonymous">
        
        <video id="vrVideo" src="video test 3.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>

      <a-sky id="skyDisplay" visible="false" radius="100" rotation="0 -90 0"></a-sky>

      <a-videosphere id="videoDisplay" src="#vrVideo" visible="false" radius="100" rotation="0 -90 0"></a-videosphere>

      <a-entity id="arStaticGroup" visible="false">
        <a-box position="0 0.5 -3" rotation="0 45 0" color="#EF2D5E" scale="0.5 0.5 0.5"></a-box>
      </a-entity>

      <a-marker id="catMarker" type="pattern" url="pattern-cat.patt" emitevents="true"></a-marker>
      
      <a-entity id="persistentCat" visible="false">
        <a-entity position="0 0.3 0" scale="0.2 0.2 0.2">
            <a-plane position="0 0 0.5" src="#catFace" material="transparent: true; opacity: 0.9;"></a-plane>
            <a-plane position="0 0 -0.5" rotation="0 180 0" color="#f39c12" material="opacity: 0.7;"></a-plane>
            <a-plane position="-0.5 0 0" rotation="0 -90 0" color="#e67e22" material="opacity: 0.7;"></a-plane>
            <a-plane position="0.5 0 0" rotation="0 90 0" color="#d35400" material="opacity: 0.7;"></a-plane>
            <a-plane position="0 0.5 0" rotation="-90 0 0" color="#f1c40f" material="opacity: 0.7;"></a-plane>
        </a-entity>
      </a-entity>

      <a-entity id="cam" camera="fov: 80" look-controls position="0 1.6 0"></a-entity>
    </a-scene>

    <script>
      const menu = document.getElementById('menu');
      const scene = document.getElementById('mainScene');
      const backBtn = document.getElementById('backBtn');
      const sky = document.getElementById('skyDisplay');
      const videoSphere = document.getElementById('videoDisplay');
      const videoAsset = document.getElementById('vrVideo');
      const staticGroup = document.getElementById('arStaticGroup');
      const persistentCat = document.getElementById('persistentCat');
      const catMarker = document.getElementById('catMarker');
      const instructions = document.getElementById('ar-instructions');

      let currentMode = "";

      function setupScene() {
        menu.style.display = 'none';
        backBtn.style.display = 'block';
        scene.style.display = 'block';
        scene.resize();
      }

      function start360(texID) {
        setupScene();
        sky.setAttribute('visible', 'true');
        sky.setAttribute('src', '#' + texID);
      }

      function startVideo() {
        setupScene();
        videoSphere.setAttribute('visible', 'true');
        // Mobile browsers require a user gesture to play video
        videoAsset.play();
      }

      function startStaticAR() {
        setupScene();
        staticGroup.setAttribute('visible', 'true');
        scene.setAttribute('arjs', 'sourceType: webcam; debugUIEnabled: false;');
      }

      function startPersistentCat() {
        setupScene();
        currentMode = "cat";
        scene.setAttribute('arjs', 'sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;');
        instructions.innerText = "Align camera with Cat Image to Lock Hologram";
        instructions.style.display = "block";
      }

      // HOLOGRAPHIC SNAP LOGIC
      catMarker.addEventListener('markerFound', () => {
        if (currentMode === "cat") {
          // Snap the persistent cat to the marker's world location
          const markerMatrix = catMarker.object3D.matrixWorld;
          persistentCat.object3D.applyMatrix4(markerMatrix);
          
          persistentCat.setAttribute('visible', 'true');
          instructions.innerText = "Hologram Anchored! You can move around it.";
          
          // Disable further marker tracking so it stays fixed in the room
          currentMode = "locked"; 
        }
      });
    </script>
  </body>
</html>
